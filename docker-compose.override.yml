version: '3.8'

services:
  db:
    image: postgres:15
    container_name: smartcampus-db-dev
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - smartcampus-dev-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartcampus-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartcampus
      SPRING_DATASOURCE_USERNAME: smartcampus
      SPRING_DATASOURCE_PASSWORD: password
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    depends_on:
      - db
    volumes:
      - ./smartcampusoperationshub:/app
      - ~/.m2:/root/.m2  # Maven cache
    networks:
      - smartcampus-dev-network
    command: ["./mvnw", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=*:5005"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartcampus-frontend-dev
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - smartcampus-dev-network
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data_dev:

networks:
  smartcampus-dev-network:
    driver: bridge</content>
<parameter name="filePath">docker-compose.dev.yml