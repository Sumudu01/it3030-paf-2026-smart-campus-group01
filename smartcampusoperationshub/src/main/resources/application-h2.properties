# H2 In-Memory Database for Development (spring.profiles.active=h2)
spring.datasource.url=jdbc:h2:mem:smartcampusdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Disable OAuth2 validation for dev (basic auth or disable)
spring.security.oauth2.client.registration.google.client-id=dummy-dev
spring.security.oauth2.client.registration.google.client-secret=dummy-dev

logging.level.org.springframework.security=INFO
